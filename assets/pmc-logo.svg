<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%" class="select-none">
  <defs>
    <!-- Sharp crisp rendering -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer P (Blue stroke modern outline) -->
