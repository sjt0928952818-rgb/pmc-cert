    <!-- C arc -->
    <path d="M 270 28 C 256 16 234 16 220 16 C 196 16 178 32 178 52 C 178 72 196 84 220 84 C 242 84 260 76 270 60" />
  </g>

  <!-- Center Organization Subtitle Badge -->
  <text x="200" y="82" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#003366" letter-spacing="2">PMC</text>
