    <path d="M 94 80 L 94 16 L 118 16 L 140 54 L 162 16 L 186 16 L 186 80 L 164 80 L 164 42 L 146 72 L 134 72 L 116 42 L 116 80 Z" />
  </g>

  <!-- Outer C (Blue stroke modern outline) -->
